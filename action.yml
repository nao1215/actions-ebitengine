name: "Setup Ebitengine"
description: "Install the system packages Ebitengine needs to build and run games (Linux, macOS, Windows / amd64, arm64)."
author: "CHIKAMATSU Naohiro"

branding:
  icon: "play"
  color: "orange"

inputs:
  xvfb:
    description: 'Also install Xvfb so games and tests can run headless on Linux (use "xvfb-run go test ./..."). Set to "true" to enable.'
    required: false
    default: "false"
  extra-packages:
    description: "Additional space-separated system packages to install on Linux."
    required: false
    default: ""
  apt-update:
    description: 'Run "apt-get update" before installing on Debian/Ubuntu. Set to "false" to skip it when the package index is already fresh.'
    required: false
    default: "true"

outputs:
  packages:
    description: "Space-separated list of the packages that were installed (empty on macOS and Windows)."
    value: ${{ steps.install.outputs.packages }}
  package-manager:
    description: 'Package manager that was used ("apt", "dnf", or "none" when nothing was needed).'
    value: ${{ steps.install.outputs.package-manager }}

runs:
  using: "composite"
  steps:
    - id: install
      shell: bash
      env:
        INPUT_XVFB: ${{ inputs.xvfb }}
        INPUT_EXTRA_PACKAGES: ${{ inputs.extra-packages }}
        INPUT_APT_UPDATE: ${{ inputs.apt-update }}
        RUNNER_OS: ${{ runner.os }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/install.sh"
